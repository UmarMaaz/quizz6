<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b;
  --accent:#0f5132; --accent2:#8a6d00; --line:#e4e1da; --danger:#8a1f11; --good:#0f5132bb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --card:#1f1e1a; --ink:#f0efe9; --sub:#a9a69d; --line:#33322c;
  }
}
:root[data-theme="dark"]{--bg:#161512;--card:#1f1e1a;--ink:#f0efe9;--sub:#a9a69d;--line:#33322c;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Georgia','Times New Roman',serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.3px;}
.sub{color:var(--sub);font-size:.85rem;font-family:system-ui,sans-serif;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.section-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
.chip{
  font-family:system-ui,sans-serif;font-size:.8rem;padding:7px 13px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--sub);margin-bottom:10px;}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--accent);transition:width .25s;}
.qtag{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);margin-bottom:8px;}
.qtext{font-size:1.15rem;line-height:1.5;margin-bottom:18px;}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);
  font-family:system-ui,sans-serif;font-size:.95rem;cursor:pointer;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:#0f513222;border-color:var(--accent);}
.opt.wrong{background:#8a1f1122;border-color:var(--danger);}
.opt[disabled]{cursor:default;}
.explain{
  margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);
  border:1px dashed var(--line);font-family:system-ui,sans-serif;font-size:.88rem;line-height:1.5;color:var(--sub);
}
.explain b{color:var(--ink);}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;gap:10px;font-family:system-ui,sans-serif;}
button.nav{
  flex:1;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;
  font-size:.9rem;cursor:pointer;
}
button.nav.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.nav:disabled{opacity:.4;cursor:default;}
.score-screen{text-align:center;}
.score-num{font-size:3rem;margin:10px 0;color:var(--accent);font-family:system-ui,sans-serif;font-weight:700;}
.start-screen p{font-family:system-ui,sans-serif;color:var(--sub);font-size:.9rem;line-height:1.6;}
footer{text-align:center;font-family:system-ui,sans-serif;font-size:.72rem;color:var(--sub);margin-top:20px;}
</style>
</head>

 which date (Hijri)?", "opts": ["1st Muharram, 60 A.H.", "10th Muharram, 61 A.H.", "15th Safar, 61 A.H.", "1st Ramadan, 62 A.H."], "ans": 1, "exp": "The Battle of Karbala took place on 10th Muharram, 61 A.H. (680 CE)."}, {"section": "Islamic Studies (Dates & Events)", "q": "The event of Mi'raj (Ascension) is commemorated on which night?", "opts": ["27th Rajab", "15th Shaban", "27th Ramadan", "1st Muharram"], "ans": 0, "exp": "The Night of Isra and Mi'raj is traditionally commemorated on the 27th of Rajab."}, {"section": "Islamic Studies (Dates & Events)", "q": "Shab-e-Barat, a night of significance in the Islamic calendar, falls on which date?", "opts": ["15th Shaban", "15th Ramadan", "27th Rajab", "1st Shawwal"], "ans": 0, "exp": "Shab-e-Barat falls on the 15th night of Shaban."}, {"section": "Islamic Studies (Dates & Events)", "q": "Laylat al-Qadr, the Night of Power, is sought within which part of Ramadan?", "opts": ["The first ten nights", "The middle ten nights", "The last ten (odd) nights", "The entire month equally"], "ans": 2, "exp": "Laylat al-Qadr is sought within the last ten nights of Ramadan, particularly the odd-numbered nights."}, {"section": "Islamic Studies (Dates & Events)", "q": "Eid-ul-Fitr is celebrated on which date?", "opts": ["1st Shawwal", "10th Dhul-Hijjah", "1st Muharram", "15th Shaban"], "ans": 0, "exp": "Eid-ul-Fitr is celebrated on the 1st of Shawwal, marking the end of Ramadan."}, {"section": "Islamic Studies (Dates & Events)", "q": "Eid-ul-Adha is celebrated on which date?", "opts": ["1st Shawwal", "10th Dhul-Hijjah", "1st Muharram", "27th Rajab"], "ans": 1, "exp": "Eid-ul-Adha is celebrated on the 10th of Dhul-Hijjah."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Day of Arafah, a significant day during Hajj, falls on:", "opts": ["8th Dhul-Hijjah", "9th Dhul-Hijjah", "10th Dhul-Hijjah", "11th Dhul-Hijjah"], "ans": 1, "exp": "The Day of Arafah falls on the 9th of Dhul-Hijjah, the day before Eid-ul-Adha."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan's National Flag Day/anniversary of flag adoption falls on:", "opts": ["11 August", "14 August", "23 March", "6 September"], "ans": 0, "exp": "The Pakistani flag was adopted on 11 August 1947, commemorated accordingly."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Youm-e-Takbeer, commemorating Pakistan's nuclear tests, is observed on:", "opts": ["11 May", "28 May", "6 September", "23 March"], "ans": 1, "exp": "Youm-e-Takbeer is observed on 28 May, marking the 1998 nuclear tests."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Kashmir Solidarity Day is observed annually on:", "opts": ["5 February", "23 March", "14 August", "27 October"], "ans": 0, "exp": "Kashmir Solidarity Day is observed on 5 February."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Youm-e-Istehsal (Day of Exploitation), marking India's occupation of Kashmir, is observed on:", "opts": ["5 February", "27 October", "6 September", "14 August"], "ans": 1, "exp": "Youm-e-Istehsal is observed on 27 October, marking the day Indian troops landed in Kashmir in 1947."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan's Independence Day celebrations officially begin with a flag-hoisting ceremony on:", "opts": ["13 August midnight", "14 August midnight", "14 August morning", "15 August morning"], "ans": 1, "exp": "Pakistan's Independence Day celebrations begin with the flag-hoisting at midnight marking 14 August."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Islamic calendar (Hijri) consists of how many months?", "opts": ["10", "11", "12", "13"], "ans": 2, "exp": "The Islamic (Hijri) calendar consists of 12 lunar months."}, {"section": "Islamic Studies (Dates & Events)", "q": "The first month of the Islamic calendar is:", "opts": ["Safar", "Muharram", "Rajab", "Ramadan"], "ans": 1, "exp": "Muharram is the first month of the Islamic calendar."}, {"section": "Islamic Studies (Dates & Events)", "q": "The last month of the Islamic calendar is:", "opts": ["Shawwal", "Dhul-Qadah", "Dhul-Hijjah", "Ramadan"], "ans": 2, "exp": "Dhul-Hijjah is the twelfth and final month of the Islamic calendar."}, {"section": "Islamic Studies (Dates & Events)", "q": "The ninth month of the Islamic calendar, during which fasting is obligatory, is:", "opts": ["Shaban", "Ramadan", "Shawwal", "Rajab"], "ans": 1, "exp": "Ramadan is the ninth month of the Islamic calendar."}, {"section": "Islamic Studies (Dates & Events)", "q": "Which month is considered one of the four sacred months in Islam, alongside Dhul-Qadah, Dhul-Hijjah, and Rajab?", "opts": ["Safar", "Muharram", "Rabi-ul-Awwal", "Shaban"], "ans": 1, "exp": "Muharram is one of the four sacred months in Islam."}, {"section": "Islamic Studies (Dates & Events)", "q": "The event of the migration to Abyssinia by early Muslims occurred in which approximate year of Prophethood?", "opts": ["1st year", "5th year", "10th year", "15th year"], "ans": 1, "exp": "The migration to Abyssinia occurred around the 5th year of Prophethood."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Pledge of Aqabah (first) occurred in which year, relative to Hijrah?", "opts": ["3 years before Hijrah", "2 years before Hijrah", "1 year before Hijrah", "Same year as Hijrah"], "ans": 2, "exp": "The First Pledge of Aqabah occurred approximately one year before the Hijrah."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Second Pledge of Aqabah, leading directly to the Hijrah, occurred:", "opts": ["2 years before Hijrah", "1 year before Hijrah", "Same year as Hijrah", "1 year after Hijrah"], "ans": 2, "exp": "The Second Pledge of Aqabah occurred in the same year as the Hijrah, directly preceding it."}, {"section": "Islamic Studies (Dates & Events)", "q": "How many years did the Prophet (PBUH) live in Madinah after the Hijrah?", "opts": ["8 years", "10 years", "12 years", "15 years"], "ans": 1, "exp": "The Prophet (PBUH) lived in Madinah for approximately 10 years after the Hijrah."}, {"section": "Islamic Studies (Dates & Events)", "q": "How old was the Prophet Muhammad (PBUH) when he received the first revelation?", "opts": ["35 years", "40 years", "45 years", "50 years"], "ans": 1, "exp": "The Prophet (PBUH) was approximately 40 years old when he received the first revelation."}, {"section": "Islamic Studies (Dates & Events)", "q": "How old was the Prophet Muhammad (PBUH) at the time of his death?", "opts": ["60 years", "63 years", "65 years", "70 years"], "ans": 1, "exp": "The Prophet (PBUH) passed away at approximately 63 years of age."}, {"section": "Islamic Studies (Dates & Events)", "q": "The construction of the Kaaba is traditionally attributed to which two prophets?", "opts": ["Adam and Nuh", "Ibrahim and Ismail", "Musa and Harun", "Dawud and Sulaiman"], "ans": 1, "exp": "The Kaaba's construction (or reconstruction) is traditionally attributed to Prophets Ibrahim and Ismail (AS)."}, {"section": "Islamic Studies (Dates & Events)", "q": "The event of the 'Year of the Elephant', associated with Abraha's attack on the Kaaba, occurred approximately how many years before the Hijrah?", "opts": ["32 years", "42 years", "52 years", "62 years"], "ans": 2, "exp": "The Year of the Elephant (570 CE) occurred approximately 52 years before the Hijrah (622 CE)."}, {"section": "Islamic Studies (Dates & Events)", "q": "Zaid bin Thabit, who compiled the Quran, served primarily during the caliphates of:", "opts": ["Abu Bakr and Umar primarily, continuing under Usman", "Only Hazrat Ali", "Only Hazrat Usman", "Only Hazrat Umar"], "ans": 0, "exp": "Zaid bin Thabit led the compilation efforts initiated under Abu Bakr and continued the standardization under Usman."}, {"section": "Islamic Studies (Dates & Events)", "q": "How many Rakat are there in the Fajr prayer (Fard)?", "opts": ["2", "3", "4", "5"], "ans": 0, "exp": "Fajr prayer consists of 2 Fard Rakat."}, {"section": "Islamic Studies (Dates & Events)", "q": "How many Rakat are there in the Zuhr prayer (Fard)?", "opts": ["2", "3", "4", "5"], "ans": 2, "exp": "Zuhr prayer consists of 4 Fard Rakat."}, {"section": "Islamic Studies (Dates & Events)", "q": "How many Rakat are there in the Maghrib prayer (Fard)?", "opts": ["2", "3", "4", "5"], "ans": 1, "exp": "Maghrib prayer consists of 3 Fard Rakat."}, {"section": "Islamic Studies (Dates & Events)", "q": "How many total Rakat (Fard) are prayed across the five daily prayers?", "opts": ["15", "17", "19", "21"], "ans": 1, "exp": "The total Fard Rakat across the five daily prayers is 17 (2+4+4+3+4)."}, {"section": "Islamic Studies (Dates & Events)", "q": "The number of times 'Allah' is mentioned in the Quran is approximately:", "opts": ["1,500", "2,000", "2,700", "3,200"], "ans": 2, "exp": "The name 'Allah' is mentioned approximately 2,700 times in the Quran (estimates vary slightly)."}, {"section": "Islamic Studies (Dates & Events)", "q": "The longest verse (Ayat) in the Quran, Ayat-ul-Dayn, is found in which Surah?", "opts": ["Al-Baqarah", "Al-Imran", "An-Nisa", "Al-Maidah"], "ans": 0, "exp": "The longest verse, dealing with debt contracts, is found in Surah Al-Baqarah (2:282)."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Defence and Martyrs Day of Pakistan Air Force, commemorating 1965 war achievements, is observed on:", "opts": ["6 September", "7 September", "6 August", "27 October"], "ans": 1, "exp": "PAF's Defence and Martyrs Day is observed on 7 September."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Iqbal Day, commemorating Allama Iqbal, is observed on:", "opts": ["9 November", "21 April", "23 March", "25 December"], "ans": 0, "exp": "Iqbal Day is observed on 9 November, Allama Iqbal's birth anniversary."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The death anniversary of Allama Iqbal is observed on:", "opts": ["9 November", "21 April", "14 August", "11 September"], "ans": 1, "exp": "Allama Iqbal passed away on 21 April 1938."}, {"section": "Pakistan rmality", "Enthusiastic", "Creative"], "ans": 1, "exp": "'Perfunctory' means carried out with minimum effort or reflection, as a mere formality."}, {"section": "General Science & Ability", "q": "If 8 men can complete a job in 15 days working 8 hours a day, how many days will 10 men take working 6 hours a day?", "opts": ["14 days", "15 days", "16 days", "18 days"], "ans": 2, "exp": "Using the formula M1×D1×H1=M2×D2×H2: 8×15×8=10×D2×6 → 960=60×D2 → D2=16 days."}, {"section": "General Science & Ability", "q": "A sum of Rs. 12,000 is invested at 6% simple interest per annum. Find the interest earned in one year.", "opts": ["Rs. 600", "Rs. 650", "Rs. 700", "Rs. 720"], "ans": 3, "exp": "SI=(12000×6×1)/100=Rs. 720."}, {"section": "General Science & Ability", "q": "Find the next term: 9, 16, 25, 36, 49, ?", "opts": ["56", "60", "64", "72"], "ans": 2, "exp": "This is the sequence of perfect squares (3²,4²,5²,6²,7²); next is 8²=64."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Day of Ashura, besides commemorating Karbala, is also associated with which earlier historical event in Islamic tradition?", "opts": ["The parting of the sea for Musa (AS)", "The birth of Isa (AS)", "The flood of Nuh (AS)", "The construction of the Kaaba"], "ans": 0, "exp": "Ashura is traditionally also associated with Allah saving Musa (AS) and the Israelites by parting the sea."}, {"section": "Islamic Studies (Dates & Events)", "q": "Fasting on the Day of Ashura is considered:", "opts": ["Obligatory (Fard)", "Highly recommended (Mustahabb/Sunnah)", "Forbidden", "Disliked"], "ans": 1, "exp": "Fasting on Ashura is considered highly recommended (Sunnah), though not obligatory."}, {"section": "Islamic Studies (Dates & Events)", "q": "The number of verses revealed in Makkah versus Madinah shows that the majority of the Quran was revealed:", "opts": ["In Makkah", "In Madinah", "Equally in both", "Outside both cities"], "ans": 0, "exp": "The majority of Quranic chapters (Surahs) were revealed in Makkah, though Madinan verses are often longer."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Meccan (Makki) revelations primarily focus on:", "opts": ["Detailed legal rulings", "Faith, monotheism, and the Hereafter", "Marriage and inheritance laws", "War and treaties"], "ans": 1, "exp": "Makki revelations primarily emphasize core beliefs: monotheism, prophethood, and the afterlife."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Madinan (Madani) revelations primarily focus on:", "opts": ["Only stories of earlier prophets", "Social legislation, laws, and community matters", "Poetry and literature", "Pre-Islamic history only"], "ans": 1, "exp": "Madani revelations largely address social legislation, laws, and matters of community governance."}, {"section": "Islamic Studies (Dates & Events)", "q": "The event known as 'Al-Isra wal-Mi'raj' consists of two parts: the night journey to Jerusalem and:", "opts": ["The return to Makkah", "The ascension through the heavens", "The battle with the Quraysh", "The migration to Madinah"], "ans": 1, "exp": "Al-Mi'raj refers to the ascension through the heavens, following the night journey (Al-Isra) to Jerusalem."}, {"section": "Islamic Studies (Dates & Events)", "q": "The number of times the Prophet (PBUH) performed Hajj after the Hijrah is:", "opts": ["Once", "Twice", "Three times", "Four times"], "ans": 0, "exp": "The Prophet (PBUH) performed Hajj only once after the Hijrah, known as the Farewell Pilgrimage."}, {"section": "Islamic Studies (Dates & Events)", "q": "The number of times the Prophet (PBUH) performed Umrah is reported to be:", "opts": ["Once", "Twice", "Three or four times", "Never"], "ans": 2, "exp": "The Prophet (PBUH) is reported to have performed Umrah three or four times."}, {"section": "Islamic Studies (Dates & Events)", "q": "The first Adhan (call to prayer) was introduced during the time of the Prophet (PBUH) in approximately:", "opts": ["1 A.H.", "2 A.H.", "5 A.H.", "10 A.H."], "ans": 1, "exp": "The Adhan was introduced around 1-2 A.H., after the Hijrah."}, {"section": "Islamic Studies (Dates & Events)", "q": "Bilal ibn Rabah (RA) is historically significant as:", "opts": ["The first scribe of the Quran", "The first Muezzin (caller to prayer) in Islam", "The first Caliph", "The compiler of Hadith"], "ans": 1, "exp": "Bilal ibn Rabah (RA) served as the first Muezzin, calling the Adhan during the Prophet's time."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The All India Muslim League's Allahabad session, where Iqbal proposed a separate state, was held in:", "opts": ["1928", "1929", "1930", "1932"], "ans": 2, "exp": "Iqbal's presidential address proposing a separate Muslim state was delivered at the Allahabad session in December 1930."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The term 'Pakistan' was coined by Choudhry Rahmat Ali in a pamphlet published in:", "opts": ["1930", "1933", "1935", "1940"], "ans": 1, "exp": "Rahmat Ali coined the term 'Pakistan' in his 1933 pamphlet 'Now or Never'."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Muslim League's Pakistan Resolution Day anniversary coincides with Pakistan's designation as a Republic under the 1956 Constitution, both observed on:", "opts": ["14 August", "23 March", "11 August", "6 September"], "ans": 1, "exp": "Both events are marked on 23 March, Pakistan Day."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The first elected Prime Minister under Pakistan's 1973 Constitution was:", "opts": ["Zulfikar Ali Bhutto", "Nurul Amin", "Muhammad Khan Junejo", "Benazir Bhutto"], "ans": 0, "exp": "Zulfikar Ali Bhutto became Prime Minister under the 1973 Constitution."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Muhammad Khan Junejo served as Prime Minister of Pakistan starting in:", "opts": ["1983", "1985", "1988", "1990"], "ans": 1, "exp": "Muhammad Khan Junejo became Prime Minister in 1985, under Zia-ul-Haq's non-party elections."}, {"section": "English", "q": "'When it rains, it pours' means:", "opts": ["Weather patterns are unpredictable", "Difficulties or events tend to occur in large numbers all at once", "Rain is beneficial", "Pouring requires caution"], "ans": 1, "exp": "This proverb means that troubles or events often come in abundance all at once, rather than individually."}, {"section": "English", "q": "'A watched pot never boils' means:", "opts": ["Cooking requires patience", "Time seems to pass slowly when anxiously waiting for something to happen", "Pots need constant attention", "Boiling water is dangerous"], "ans": 1, "exp": "This proverb means that waiting for something to happen makes the time feel longer."}, {"section": "English", "q": "Choose the word closest in meaning to 'Taciturn':", "opts": ["Talkative", "Reserved and saying little", "Angry", "Friendly"], "ans": 1, "exp": "'Taciturn' means reserved or uncommunicative; saying little."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Connoisseur", "Connoisseuur", "Conoisseur", "Connaisseur"], "ans": 0, "exp": "The correct spelling is 'Connoisseur'."}, {"section": "General Science & Ability", "q": "If 12 workers can complete a project in 18 days, how many workers are needed to finish it in 9 days?", "opts": ["20", "22", "24", "26"], "ans": 2, "exp": "12×18=x×9 → x=216/9=24."}, {"section": "General Science & Ability", "q": "A sum of Rs. 27,000 is divided among three people in the ratio 2:3:4. Find the middle share.", "opts": ["Rs. 8,000", "Rs. 9,000", "Rs. 10,000", "Rs. 11,000"], "ans": 1, "exp": "Total parts=9; 1 part=3000; middle share=3×3000=Rs. 9,000."}, {"section": "General Science & Ability", "q": "Find the value of (81)^(1/4):", "opts": ["2", "3", "4", "9"], "ans": 1, "exp": "81^(1/4) means the fourth root of 81, which is 3 (since 3⁴=81)."}, {"section": "Islamic Studies (Dates & Events)", "q": "The practice of 'Qurbani' (ritual sacrifice) during Eid-ul-Adha commemorates the willingness of which ial Law Administrator."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The first Pakistani woman to become a federal minister was:", "opts": ["Benazir Bhutto", "Fatima Jinnah", "Vikramajeet Kaur", "Begum Rana Liaquat Ali Khan"], "ans": 3, "exp": "Begum Rana Liaquat Ali Khan was among the earliest prominent women in Pakistani public life, closely involved in state affairs from the early years."}, {"section": "English", "q": "'Variety is the spice of life' means:", "opts": ["Cooking requires variety", "Diverse experiences make life more interesting and enjoyable", "Spices are valuable", "Routine is harmful"], "ans": 1, "exp": "This proverb means that having diverse experiences adds interest and richness to life."}, {"section": "English", "q": "Choose the word closest in meaning to 'Nonchalant':", "opts": ["Anxious", "Calm and relaxed; unconcerned", "Angry", "Enthusiastic"], "ans": 1, "exp": "'Nonchalant' means appearing calm and relaxed; not displaying anxiety or excitement."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Possession", "Posession", "Possesion", "Posession"], "ans": 0, "exp": "The correct spelling is 'Possession' (double 's', double 's')."}, {"section": "General Science & Ability", "q": "A sum of Rs. 8,800 is divided between P and Q in the ratio 5:6. Find Q's share.", "opts": ["Rs. 3,800", "Rs. 4,000", "Rs. 4,200", "Rs. 4,800"], "ans": 3, "exp": "Total parts=11; 1 part=800; Q's share=6×800=Rs. 4,800."}, {"section": "General Science & Ability", "q": "Find the next term: 2, 5, 11, 23, 47, 95, ?", "opts": ["191", "193", "189", "187"], "ans": 0, "exp": "Each term is double the previous plus 1: 95×2+1=191."}, {"section": "Islamic Studies (Dates & Events)", "q": "The migration of the Prophet's companions to Abyssinia occurred in two waves; the first is traditionally dated to:", "opts": ["610 CE", "615 CE", "620 CE", "622 CE"], "ans": 1, "exp": "The first migration to Abyssinia is traditionally dated to around 615 CE."}, {"section": "Islamic Studies (Dates & Events)", "q": "The social boycott of the Banu Hashim clan by the Quraysh lasted approximately:", "opts": ["1 year", "2 years", "3 years", "5 years"], "ans": 2, "exp": "The boycott of Banu Hashim lasted approximately three years."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The first Pakistani film to win international recognition, boosting early Pakistani cinema, was released around:", "opts": ["1948", "1956", "1960", "1970"], "ans": 1, "exp": "Pakistan's film industry gained early momentum in the mid-1950s."}, {"section": "English", "q": "'Easier said than done' means:", "opts": ["Talking is simple", "Something may sound simple to suggest but is difficult to actually accomplish", "Actions are unnecessary", "Planning takes too long"], "ans": 1, "exp": "This idiom means that something may be easy to suggest or talk about, but difficult to actually carry out."}, {"section": "General Science & Ability", "q": "If the simple interest on a sum for 4 years at 9% is Rs. 3,240, find the sum.", "opts": ["Rs. 8,500", "Rs. 9,000", "Rs. 9,500", "Rs. 10,000"], "ans": 1, "exp": "P=(3240×100)/(9×4)=Rs. 9,000."}, {"section": "Islamic Studies (Dates & Events)", "q": "The number of wives the Prophet Muhammad (PBUH) had over his lifetime is traditionally recorded as:", "opts": ["9", "11", "13", "15"], "ans": 1, "exp": "The Prophet (PBUH) is traditionally recorded as having married 11 wives over his lifetime (with 9 surviving him)."}, {"section": "General Science & Ability", "q": "Find the next term: 100, 50, 51, 25.5, ?", "opts": ["26.5", "25.5", "27", "24.5"], "ans": 0, "exp": "The pattern alternates between halving and adding 1: 100÷2=50, 50+1=51, 51÷2=25.5, then 25.5+1=26.5."}, {"section": "Islamic Studies (Dates & Events)", "q": "The term 'Sahabah' refers to:", "opts": ["Scholars of Hadith", "Companions who met the Prophet (PBUH) and accepted Islam", "Later Islamic jurists", "Prophets before Muhammad (PBUH)"], "ans": 1, "exp": "'Sahabah' refers to the companions who personally met the Prophet Muhammad (PBUH) and accepted Islam, dying as Muslims."}, {"section": "Islamic Studies (Dates & Events)", "q": "The term 'Tabi'un' refers to:", "opts": ["The Prophet's companions", "The generation that followed the Sahabah, who met companions but not the Prophet", "Modern Islamic scholars", "The four Caliphs"], "ans": 1, "exp": "'Tabi'un' refers to the generation after the Sahabah, who met the companions but not the Prophet himself."}, {"section": "Islamic Studies (Dates & Events)", "q": "The term 'Tabi-Tabi'in' refers to:", "opts": ["The companions directly", "The third generation, following the Tabi'un", "Modern-day Muslims", "Angels"], "ans": 1, "exp": "'Tabi-Tabi'in' refers to the third generation of Muslims, who followed the Tabi'un."}, {"section": "Islamic Studies (Dates & Events)", "q": "These three generations (Sahabah, Tabi'un, Tabi-Tabi'in) are collectively known in Islamic tradition as:", "opts": ["The Rightly Guided Caliphs", "The best generations (Khair-ul-Qurun)", "The Mujaddideen", "The Awliya"], "ans": 1, "exp": "These three generations are collectively referred to as the best generations, based on a Hadith of the Prophet (PBUH)."}, {"section": "Islamic Studies (Dates & Events)", "q": "The six authentic Hadith collections (Sihah Sittah) include Sahih Bukhari, Sahih Muslim, and four others compiled by:", "opts": ["Abu Dawood, Tirmidhi, Nasa'i, and Ibn Majah", "Only Bukhari and Muslim", "Malik, Shafi'i, Hanafi, and Hanbali", "Ghazali, Razi, Ibn Taymiyyah, and Ibn Kathir"], "ans": 0, "exp": "The Sihah Sittah (six authentic books) include works by Abu Dawood, Tirmidhi, An-Nasa'i, and Ibn Majah, alongside Bukhari and Muslim."}, {"section": "Islamic Studies (Dates & Events)", "q": "'Muwatta Imam Malik', one of the earliest Hadith/Fiqh compilations, predates Sahih Bukhari by approximately:", "opts": ["50 years", "100 years", "150 years", "200 years"], "ans": 0, "exp": "The Muwatta, compiled by Imam Malik in the 8th century, predates Sahih Bukhari (9th century) by roughly 50-70 years."}, {"section": "Islamic Studies (Dates & Events)", "q": "The event of the 'Opening of the Chest' (Shaq al-Sadr), a reported event in the Prophet's childhood, is associated with his time:", "opts": ["In Makkah as an adult", "As a child with his wet-nurse Halima", "During the Hijrah", "At the Battle of Badr"], "ans": 1, "exp": "The 'Opening of the Chest' is traditionally associated with the Prophet's (PBUH) childhood while in the care of his wet-nurse Halima."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Prophet's (PBUH) grandfather, who cared for him after his mother's death, was:", "opts": ["Abu Talib", "Abdul Muttalib", "Abu Lahab", "Hamza"], "ans": 1, "exp": "Abdul Muttalib, the Prophet's grandfather, cared for him after his mother Amina's death."}, {"section": "Islamic Studies (Dates & Events)", "q": "After Abdul Muttalib's death, the Prophet (PBUH) was raised primarily by his uncle:", "opts": ["Abu Lahab", "Abu Talib", "Hamza", "Abbas"], "ans": 1, "exp": "Abu Talib, the Prophet's uncle, raised him after Abdul Muttalib's death."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Prophet's (PBUH) first wife, Khadijah (RA), was how many years older than him?", "opts": ["5 years", "10 years", "15 years", "20 years"], "ans": 2, "exp": "Khadijah (RA) was approximately 15 years older than the Prophet (PBUH) when they married."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Prophet (PBUH) married Khadijah (RA) at approximately what age?", "opts": ["20 years", "25 years", "30 years", "35 years"], "ans": 1, "exp": "The Prophet (PBUH) married Khadijah (RA) at approximately 25 years of age."}, {"section": "Islamic Studies (Dates & Events)", "q": "How many children did the Prophet (PBUH) have with Khadijah (RA)?", "opts": ["Two", "Four", "Six", "Eight"], "ans": 2, "exp": "The Prophet (PBUH) had six children with Khadijah (RA): two sons and four daughters."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Prophet's (PBUH) daughter who survived him and continued his lineage was:", "opts": ["Zainab", "Ruqayyah", "Umm Kulthum", "Fatimah"], "ans": 3, "exp": "Fatimah (RA) was the only child of the Prophet (PBUH) to survive him, continuing his lineage through her children."}, {"section": "Islamic Studies (Dates & Events)", "q": "Hazrat Fatimah (RA) was married to:", "opts": ["Hazrat Abu Bakr (RA)", "Hazrat Umar (RA)", "Hazrat Ali (RA)", "Hazrat Usman (RA)"], "ans": 2, "exp": "Hazrat Fatimah (RA) was married to Hazrat Ali (RA)."}, {"section": "Islamic Studies (Dates & Events)", "q": "Hazrat Usman (RA) was notably married to two of the Prophet's daughters consecutively, earning him the title:", "opts": ["Siddiq", "Farooq", "Zun-Nurayn (possessor of two lights)", "Asadullah"], "ans": 2, "exp": "Hazrat Usman (RA) is known as 'Zun-Nurayn' for having married two of the Prophet's daughters, Ruqayyah and later Umm Kulthum."}, {"section": "Islamic Studies (Dates & Events)", "q": "Hazrat Abu Bakr's title 'As-Siddiq' (the truthful) was earned primarily for his:", "opts": ["Military leadership", "Immediate belief in the Mi'raj (Night Journey)", "Wealth and generosity", "Poetry"], "ans": 1, "exp": "Abu Bakr (RA) earned the title 'As-Siddiq' for his immediate and unwavering belief in the Prophet's account of the Mi'raj."}, {"section": "Islamic Studies (Dates & Events)", "q": "Hazrat Umar's title 'Al-Farooq' means:", "opts": ["The truthful", "The distinguisher (between right and wrong)", "The brave", "The generous"], "ans": 1, "exp": "'Al-Farooq' means 'the one who distinguishes between truth and falsehood', a title given to Hazrat Umar (RA)."}, {"section": "Islamic Studies (Dates & Events)", "q": "The event of Hazrat Umar's (RA) acceptance of Islam is traditionally dated to around the:", "opts": ["5th year of Prophethood", "6th year of Prophethood", "10th year of Prophethood", "Year of Hijrah"], "ans": 1, "exp": "Hazrat Umar's (RA) conversion is traditionally dated to around the 6th year of Prophethood."}, {"section": "Islamic Studies (Dates & Events)", "q": "Hazrat Hamza (RA), the Prophet's uncle known for his bravery, was martyred at which battle?", "opts": ["Badr", "Uhud", "Khandaq", "Hunayn"], "ans": 1, "exp": "Hazrat Hamza (RA) was martyred at the Battle of Uhud in 3 A.H."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The first Pakistani Olympic medal (gold) was won in which sport, at the 1960 Rome Olympics?", "opts": ["Wrestling", "Hockey", "Boxing", "Athletics"], "ans": 1, "exp": "Pakistan won its first Olympic gold medal in field hockey at the 1960 Rome Olympics."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan's victory in the inaugural Hockey World Cup occurred in:", "opts": ["1971", "1975", "1978", "1982"], "ans": 0, "exp": "Pakistan won the first Hockey World Cup in 1971."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The first Pakistan-India cricket Test series after independence was played in:", "opts": ["1950", "1952", "1954", "1960"], "ans": 1, "exp": "The first Test series between Pakistan and India was played in 1952."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan's membership in the United Nations Security Council as a non-permanent member first occurred around:", "opts": ["1952-1953", "1968-1969", "1976-1977", "1983-1984"], "ans": 1, "exp": "Pakistan first served as a UNSC non-permanent member in 1968-1969."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The founding of Radio Pakistan's external services division occurred around:", "opts": ["1947", "1949", "1955", "1960"], "ans": 1, "exp": "Radio Pakistan's external services were expanded in the years following 1949."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The establishment of Pakistan's first university, the University of the Punjab, predates independence, having been founded in:", "opts": ["1882", "1900", "1920", "1947"], "ans": const SECTIONS = [...new Set(QUESTIONS.map(q=>q.section))];
let state = {
  section: 'All',
  pool: [],
  idx: 0,
  answered: {},
  score: 0
};

function buildPool(section){
  const list = section === 'All' ? QUESTIONS : QUESTIONS.filter(q=>q.section===section);
  return list.map((q,i)=>({...q, poolIndex:i}));
}

function startQuiz(section){
  state.section = section;
  state.pool = buildPool(section);
  state.idx = 0;
  state.answered = {};
  state.score = 0;
  renderQuestion();
}

function renderStart(){
  const app = document.getElementById('app');
  let chips = SECTIONS.map(s=>`<div class="chip" data-sec="${s}">${s} (${QUESTIONS.filter(q=>q.section===s).length})</div>`).join('');
  app.innerHTML = `
    <div class="card start-screen">
      <p>Choose a section to focus on, or take the full mixed quiz. Each question shows a short explanation right after you answer.</p>
      <div class="section-picker">
        <div class="chip active" data-sec="All">All Sections (${QUESTIONS.length})</div>
        ${chips}
      </div>
      <div class="nav-row">
        <button class="nav" id="beginBtn">Start Quiz</button>
      </div>
    </div>`;
  let chosen = 'All';
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      chosen = c.dataset.sec;
    });
  });
  document.getElementById('beginBtn').addEventListener('click', ()=> startQuiz(chosen));
}

function renderQuestion(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/total)*100);
  const already = state.answered[state.idx];

  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'opt';
    let disabledAttr = '';
    if(already !== undefined){
      disabledAttr = 'disabled';
      if(i === q.ans) cls += ' correct';
      else if(i === already) cls += ' wrong';
    }
    return `<button class="${cls}" data-i="${i}" ${disabledAttr}>${String.fromCharCode(65+i)}. ${opt}</button>`;
  }).join('');

  const explainHtml = already !== undefined ? `<div class="explain"><b>${already===q.ans?'Correct. ':'Not quite. '}</b>${q.exp}</div>` : '';

  app.innerHTML = `
    <div class="progress-row">
      <span>Question ${state.idx+1} / ${total}</span>
      <span>Score: ${state.score}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtag">${q.section}</div>
      <div class="qtext">${q.q}</div>
      ${optsHtml}
      ${explainHtml}
      <div class="nav-row">
        <button class="nav secondary" id="prevBtn" ${state.idx===0?'disabled':''}>Previous</button>
        <button class="nav" id="nextBtn" ${already===undefined?'disabled':''}>${state.idx===total-1?'Finish':'Next'}</button>
      </div>
    </div>`;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered[state.idx] !== undefined) return;
      const i = parseInt(btn.dataset.i);
      state.answered[state.idx] = i;
      if(i === q.ans) state.score++;
      renderQuestion();
    });
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(state.idx>0){ state.idx--; renderQuestion(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.idx < total-1){ state.idx++; renderQuestion(); }
    else renderScore();
  });
}

function renderScore(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  app.innerHTML = `
    <div class="card score-screen">
      <div class="qtag">${state.section}</div>
      <div>You scored</div>
      <div class="score-num">${state.score} / ${total}</div>
      <div class="sub">${pct}% correct</div>
      <div class="nav-row">
        <button class="nav secondary" id="retryBtn">Retry Section</button>
        <button class="nav" id="homeBtn">Choose Another Section</button>
      </div>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(state.section));
  document.getElementById('homeBtn').addEventListener('click', renderStart);
}

renderStart();
</script>
</body>
</html>
